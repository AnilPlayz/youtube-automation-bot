# ==========================================
# AI Minecraft Shorts Automation Configuration
# ==========================================

channel:
  name: "Anil Playz"
  handle: "@Anil-Patel-29"
  watermark_text: "@Anil-Patel-29" # Displayed on the video
  watermark_opacity: 0.85          # 0.0 to 1.0
  watermark_position: "top_right"  # "top_right", "top_left", "bottom_center", "bottom_right"

player:
  # Provide either a valid Java/Bedrock Minecraft username or place your skin.png in assets/skins/skin.png
  minecraft_username: "Anil_playz29" # Your Minecraft username
  skin_path: "assets/skins/custom_character.png"
  render_type: "full_body"         # "isometric_bust", "2d_avatar", "full_body"
  avatar_position: "bottom_left"   # "bottom_left", "bottom_right", "top_left"
  avatar_scale: 0.28               # Relative size on screen (0.2 - 0.4 recommended)
  avatar_animation: "talking_bob"  # "talking_bob", "breathe", "static"

voice:
  # Edge-TTS voice list: en-US-ChristopherNeural (male energetic), en-US-GuyNeural, en-US-EricNeural, en-US-JennyNeural (female)
  tts_voice: "en-US-ChristopherNeural"
  tts_rate: "+12%"                 # Speech rate (+10% to +15% works best for Shorts)
  tts_pitch: "+0Hz"

script:
  # AI Model selection
  model: "gemini-1.5-flash"        # "gemini-1.5-flash", "gemini-2.0-flash", "gemini-1.5-pro"
  target_duration_seconds: 40      # 30 to 50 seconds for optimal Shorts retention
  topic_types:
    - "hidden_mechanics"
    - "creepy_lore"
    - "rare_world_generation"
    - "historical_bugs_and_facts"
    - "mob_secrets"
    - "underrated_crafting_tricks"

video:
  width: 1080
  height: 1920
  fps: 30
  gameplay_dir: "assets/gameplay"
  music_dir: "assets/music"
  music_volume: 0.12               # Background music volume (0.0 to 1.0)
  duck_music_under_speech: true    # Automatically keep speech crisp
  font_name: "Arial-Bold"          # System font or path to .ttf in assets/fonts/

captions:
  font_size: 72
  primary_color: "#FFE600"         # Bright Shorts yellow
  secondary_color: "#FFFFFF"       # Crisp white
  highlight_color: "#00FF66"       # Neon green highlight on active spoken word
  stroke_color: "#000000"          # Black outline
  stroke_width: 6
  words_per_subtitle_chunk: 3      # 2-4 words per popup for viral TikTok/Shorts pacing
  position_y_ratio: 0.65           # 0.65 = slightly below center, clear of YouTube UI overlay

youtube:
  privacy_status: "public"         # "public", "unlisted", "private"
  category_id: "20"                # 20 = Gaming
  default_tags:
    - "minecraft"
    - "minecraft facts"
    - "minecraft shorts"
    - "gaming"
    - "minecraft secrets"
    - "shorts"
    - "viral"

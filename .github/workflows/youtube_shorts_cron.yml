name: YouTube Shorts 3-Hour Automation

on:
  schedule:
    # Runs every 3 hours at minute 0 (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (Test video generation without uploading to YouTube)'
        required: false
        default: false
        type: boolean
      topic:
        description: 'Force a specific topic (optional)'
        required: false
        default: ''
        type: string
      privacy:
        description: 'YouTube Video Privacy'
        required: false
        default: 'public'
        type: choice
        options:
          - public
          - unlisted
          - private

concurrency:
  group: youtube-shorts-publisher
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: 'release'

      - name: Install Hindi fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-extra fonts-freefont-ttf fonts-dejavu-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download gameplay background
        env:
          GAMEPLAY_SOURCE_URL: ${{ vars.GAMEPLAY_SOURCE_URL || 'https://youtu.be/OqPxaKs8xrk' }}
        run: |
          echo "Downloading and transforming gameplay footage..."
          python scripts/download_background.py || echo "⚠️ Gameplay download failed — will use animated backdrop"

      - name: Run Video Generation & YouTube Upload
        id: pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          MINECRAFT_USERNAME: ${{ vars.MINECRAFT_USERNAME || secrets.MINECRAFT_USERNAME || 'Anil_playz29' }}
          WATERMARK_TEXT: ${{ vars.WATERMARK_TEXT || secrets.WATERMARK_TEXT || '@Anil-Patel-29' }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            FLAGS="$FLAGS --topic ${{ github.event.inputs.topic }}"
          fi
          if [ -n "${{ github.event.inputs.privacy }}" ]; then
            FLAGS="$FLAGS --privacy ${{ github.event.inputs.privacy }}"
          fi

          echo "Running automation with flags: $FLAGS"
          python main.py $FLAGS

      - name: Commit and push topic history
        if: success() || failure()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/used_topics.json assets/skins/
          if git diff --staged --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "Auto-update used topics history [skip ci]"
            git push
          fi
